# Loop Runtime 产物存储 Schema。
# 本文件定义项目 `.loop/` 工作区内各类运行产物的标准目录和命名规则。
# 它不保存具体项目 Trust、Permission 或某次运行的实际状态。
version: 2

workspace:
  # 每个项目的 Loop 工作区固定为项目根目录下的 `.loop/`。
  root: .loop

artifacts:
  runtime:
    # Runtime 基础设施；每次 Run 的状态、Snapshot、Mutation Journal 独立存储。
    directory: runtime
    runsDirectory: runtime/runs/<run-id>
    state: runtime/runs/<run-id>/state.yaml
    policySnapshot: runtime/runs/<run-id>/policy-snapshot.yaml
    mutationJournal: runtime/runs/<run-id>/mutation-journal.jsonl
    history: runtime/history.jsonl
    locks: runtime/locks
  plans:
    directory: plans
    filename: <run-id>.md
  specs:
    directory: specs/<run-id>
    filename: <spec-id>.pecs.md
  evidence:
    directory: evidence/<run-id>
    filename: <evidence-id>.yaml
  reviews:
    directory: reviews
    filename: <run-id>.md

rules:
  # 所有运行产物必须通过 run-id 与一次 Loop 运行关联。
  requireRunIdAssociation: true
  runtimeCannotOwnProjectPolicy: true
  workspaceRootIsCanonical: true
  # 多个 Run 可以并行；Run 不是项目级互斥锁。
  runIsNotProjectLock: true
  executionRequiresPolicySnapshot: true
  requirePolicyRevisionMatch: true
  # State 与 Mutation 都必须具备可追溯的 Run 级持久化记录。
  stateTransitionRequiresRunLock: true
  mutationRequiresGitBaseline: true
  mutationRequiresJournal: true
