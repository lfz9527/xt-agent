# Loop Runtime 状态 Schema。
# 本文件描述一次运行的事实状态，不描述项目配置。
# Trust、Permission 和项目 Policy 不属于 Runtime。
version: 1

run:
  # 当前 Loop 运行的唯一 ID。
  id: <unique-run-id>
  # 当前状态机状态。
  status: INIT
  # 当前迭代次数。
  iteration: 0
  # 当前 FIX 次数。
  fixAttempts: 0
  # 当前连续重复失败次数。
  sameFailureCount: 0

context:
  # 本次运行对应的项目根目录。
  projectRoot: <project-root>
  # INIT 时捕获的 Git 基线 Commit。
  baselineCommit: <git-commit-sha>
  # INIT 时捕获的 Git 分支。
  baselineBranch: <git-branch>

request:
  # 本次运行的用户目标。
  goal: <goal>
  # 用户目标对应的验收标准。
  acceptanceCriteria: []

plan:
  # 当前计划内容或宿主 Runtime 对计划的引用。
  artifact: <runtime-managed-reference>

active:
  # 当前正在处理的任务。
  task: null
  # 当前 Loop 阶段。
  phase: INIT

criteria:
  # 每个验收标准的 Runtime 执行状态。
  items: []

verification:
  # 当前 Verification 状态。
  status: pending
  # 当前运行关联的 Evidence ID。
  evidence: []

review:
  # 当前 Review 状态。
  status: pending

approval:
  # 只记录实际发生的审批事件。
  # 它不是项目 Trust 或 Permission 的配置来源。
  history: []

updatedAt: <timestamp>

# 状态机只允许以下固定转移。
stateRules:
  INIT:
    # 初始化后进入目标评审或阻断。
    allowedNext: [GOAL_REVIEW, BLOCKED]
  GOAL_REVIEW:
    # 目标评审完成后进入执行前 Gate 或阻断。
    allowedNext: [WAITING_FOR_GOAL_CONFIRMATION, BLOCKED]
  WAITING_FOR_GOAL_CONFIRMATION:
    # Gate 通过后进入计划阶段。
    allowedNext: [PLAN, BLOCKED]
  PLAN:
    # 计划完成后进入实现阶段。
    allowedNext: [IMPLEMENT, BLOCKED]
  IMPLEMENT:
    # 实现完成后进入验证阶段。
    allowedNext: [VERIFY, BLOCKED]
  VERIFY:
    # 验证通过进入 Review，失败进入 FIX。
    allowedNext: [REVIEW, FIX, BLOCKED]
  REVIEW:
    # Review 通过进入最终 Gate，失败进入 FIX。
    allowedNext: [READY_FOR_CONFIRMATION, FIX, BLOCKED]
  READY_FOR_CONFIRMATION:
    # 最终 Gate 通过进入 DONE，拒绝进入 FIX。
    allowedNext: [DONE, FIX, BLOCKED]
  FIX:
    # 修复完成后重新进入实现阶段。
    allowedNext: [IMPLEMENT, BLOCKED]
  DONE:
    # DONE 是终止状态。
    allowedNext: []
  BLOCKED:
    # BLOCKED 是终止状态。
    allowedNext: []
