# Loop Runtime 状态 Schema。
# 这里描述一次 Loop 运行，不描述项目级配置。
# 项目级 Trust 和 Permission 唯一来源是项目根目录 `.loop`。
version: 1

run:
  # 当前 Loop 运行唯一 ID。
  id: <unique-run-id>
  # 当前状态机状态。
  status: INIT
  # 当前迭代次数。
  iteration: 0
  # 当前 FIX 次数。
  fixAttempts: 0
  # 当前连续重复失败次数。
  sameFailureCount: 0

context:
  # 项目根目录。
  projectRoot: <absolute-or-project-relative-root>
  # INIT 时记录的 Git 基线 Commit。
  baselineCommit: <git-commit-sha>
  # INIT 时记录的 Git 基线分支。
  baselineBranch: <git-branch>

request:
  # 用户要求完成的目标。
  goal: <goal>
  # 验收标准列表。
  acceptanceCriteria: []

plan:
  # 当前计划产物路径。
  artifact: <relative-path>

active:
  # 当前活动任务；没有活动任务时为空。
  task: null
  # 当前 Loop 阶段。
  phase: INIT

criteria:
  # 验收标准当前状态由 Runtime 管理。
  {}

verification:
  # 验证状态：pending、passed、failed 等。
  status: pending
  # 关联的 Evidence ID。
  evidence: []

review:
  # Review 状态。
  status: pending

approval:
  # Runtime 只记录审批事件，不保存第二份 Trust 配置。
  # 每次 Gate 判断时，都从项目根目录 `.loop` 解析当前有效策略。
  history: []

# 状态最后更新时间。
updatedAt: <timestamp>

# -------------------- 状态机规则 --------------------
# INIT -> GOAL_REVIEW -> WAITING_FOR_GOAL_CONFIRMATION -> PLAN -> IMPLEMENT
# IMPLEMENT -> VERIFY -> REVIEW -> READY_FOR_CONFIRMATION -> DONE
# VERIFY -> FIX；REVIEW -> FIX；READY_FOR_CONFIRMATION -> FIX。
# FIX -> IMPLEMENT。
# 任意活动状态都可以在无法安全继续时进入 BLOCKED。
# WAITING_FOR_GOAL_CONFIRMATION 和 READY_FOR_CONFIRMATION 的审批策略
# 必须从项目 `.loop` 解析，不得从 Runtime 状态读取 Trust。

stateRules:
  INIT:
    # 初始化只能进入 Goal Review 或阻断。
    allowedNext: [GOAL_REVIEW, BLOCKED]
  GOAL_REVIEW:
    # Goal Review 完成后进入执行前 Gate 或阻断。
    allowedNext: [WAITING_FOR_GOAL_CONFIRMATION, BLOCKED]
  WAITING_FOR_GOAL_CONFIRMATION:
    # Gate 通过后进入计划阶段。
    allowedNext: [PLAN, BLOCKED]
  PLAN:
    # 计划完成后进入实现阶段。
    allowedNext: [IMPLEMENT, BLOCKED]
  IMPLEMENT:
    # 实现完成后进入验证阶段。
    allowedNext: [VERIFY, BLOCKED]
  VERIFY:
    # 验证通过进入 Review，失败进入 FIX。
    allowedNext: [REVIEW, FIX, BLOCKED]
  REVIEW:
    # Review 通过进入 Final Gate，失败进入 FIX。
    allowedNext: [READY_FOR_CONFIRMATION, FIX, BLOCKED]
  READY_FOR_CONFIRMATION:
    # Final Gate 通过进入 DONE，拒绝进入 FIX。
    allowedNext: [DONE, FIX, BLOCKED]
  FIX:
    # 修复完成后重新实现。
    allowedNext: [IMPLEMENT, BLOCKED]
  DONE:
    # DONE 是终止状态。
    allowedNext: []
  BLOCKED:
    # BLOCKED 是终止状态。
    allowedNext: []
