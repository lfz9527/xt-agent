# Loop Runtime 状态 Schema。
# 本文件描述一次运行的事实状态，不描述项目配置。
# Trust、Permission 和项目 Policy 不属于 Runtime。
version: 1

run:
  # 当前 Loop 运行的唯一 ID。
  id: <unique-run-id>
  # 当前状态机状态。
  status: INIT
  # 当前迭代次数。
  iteration: 0
  # 当前 FIX 次数。
  fixAttempts: 0
  # 当前连续重复失败次数。
  sameFailureCount: 0

context:
  # 本次运行对应的项目根目录。
  projectRoot: <project-root>
  # INIT 时捕获的 Git 基线 Commit。
  baselineCommit: <git-commit-sha>
  # INIT 时捕获的 Git 分支。
  baselineBranch: <git-branch>

request:
  # 本次运行的用户目标。
  goal: <goal>
  # 用户目标对应的验收标准。
  acceptanceCriteria: []

policy:
  # 本次运行解析策略的 Revision；不保存项目策略本身。
  policyRevision: <revision>
  # 当前执行使用的策略快照引用。
  snapshot: .loop/runtime/policy-snapshot.yaml

plan:
  # 当前计划产物在项目 `.loop/plans/` 中的规范引用。
  artifact: .loop/plans/<run-id>.md

specs:
  # 当前运行关联的 Spec / PECS 产物引用。
  artifacts: []

active:
  # 当前正在处理的任务。
  task: null
  # 当前 Loop 阶段。
  phase: INIT

criteria:
  # 每个验收标准的 Runtime 执行状态。
  items: []

verification:
  # 当前 Verification 状态。
  status: pending
  # 当前运行关联的 Evidence ID。
  evidence: []

review:
  # 当前 Review 状态。
  status: pending

approval:
  # 只记录实际发生的审批事件。
  # 它不是项目 Trust 或 Permission 的配置来源。
  history: []

updatedAt: <timestamp>

# 状态转移除了 allowedNext 外，还必须满足 guard。
# Runtime 不得仅凭合法状态名称跳过 Gate、Verification 或 Review。
stateRules:
  requireTransitionGuards: true

  INIT:
    allowedNext: [GOAL_REVIEW, BLOCKED]

  GOAL_REVIEW:
    allowedNext: [WAITING_FOR_GOAL_CONFIRMATION, BLOCKED]

  WAITING_FOR_GOAL_CONFIRMATION:
    allowedNext: [PLAN, BLOCKED, PAUSED]
    guards:
      PLAN:
        - approval.beforeExecution == approved
        - policy.policyRevision == currentPolicyRevision
      PAUSED:
        - pause.reason in [approval_required, external_dependency, user_requested_pause]

  PLAN:
    allowedNext: [IMPLEMENT, BLOCKED, PAUSED]
    guards:
      IMPLEMENT:
        - plan.artifact exists
      PAUSED:
        - pause.reason in [approval_required, external_dependency, user_requested_pause]

  IMPLEMENT:
    allowedNext: [VERIFY, BLOCKED, PAUSED]
    guards:
      VERIFY:
        - implementation.completed == true
      PAUSED:
        - pause.reason in [approval_required, external_dependency, user_requested_pause]

  VERIFY:
    allowedNext: [REVIEW, FIX, BLOCKED, PAUSED]
    guards:
      REVIEW:
        - verification.status == passed
      FIX:
        - verification.status == failed
      PAUSED:
        - pause.reason in [approval_required, external_dependency, user_requested_pause]

  REVIEW:
    allowedNext: [READY_FOR_CONFIRMATION, FIX, BLOCKED, PAUSED]
    guards:
      READY_FOR_CONFIRMATION:
        - review.status == passed
      FIX:
        - review.status == failed
      PAUSED:
        - pause.reason in [approval_required, external_dependency, user_requested_pause]

  READY_FOR_CONFIRMATION:
    allowedNext: [DONE, FIX, BLOCKED, PAUSED]
    guards:
      DONE:
        - acceptanceCriteria.allPassed == true
        - verification.status == passed
        - review.status == passed
        - approval.beforeFinalize in [approved, automatic]
        - policy.policyRevision == currentPolicyRevision
      FIX:
        - approval.beforeFinalize == rejected
      PAUSED:
        - pause.reason in [approval_required, external_dependency, user_requested_pause]

  FIX:
    allowedNext: [IMPLEMENT, BLOCKED, PAUSED]
    guards:
      IMPLEMENT:
        - fixAttempts <= maxFixAttempts
      PAUSED:
        - pause.reason in [approval_required, external_dependency, user_requested_pause]

  PAUSED:
    allowedNext: [WAITING_FOR_GOAL_CONFIRMATION, PLAN, IMPLEMENT, VERIFY, REVIEW, READY_FOR_CONFIRMATION, FIX, BLOCKED]
    guards:
      WAITING_FOR_GOAL_CONFIRMATION:
        - resumeRequested == true
        - resumeStateValid == true
      PLAN:
        - resumeRequested == true
        - resumeStateValid == true
      IMPLEMENT:
        - resumeRequested == true
        - resumeStateValid == true
      VERIFY:
        - resumeRequested == true
        - resumeStateValid == true
      REVIEW:
        - resumeRequested == true
        - resumeStateValid == true
      READY_FOR_CONFIRMATION:
        - resumeRequested == true
        - resumeStateValid == true
      FIX:
        - resumeRequested == true
        - resumeStateValid == true
      BLOCKED:
        - pauseExpired == true

  DONE:
    allowedNext: []

  BLOCKED:
    allowedNext: []

# PAUSED 是可恢复等待态；恢复必须由 Runtime 校验原状态、Policy Revision 和产物完整性。
paused:
  terminal: false
  resumeInPlace: true
  reasons: [approval_required, external_dependency, user_requested_pause]

# BLOCKED 是安全终止态，不允许原地 Resume。
blocked:
  terminal: true
  resumeInPlace: false
