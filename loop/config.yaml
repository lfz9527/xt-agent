version: 1

loop:
  maxIterations: 10
  maxFixAttempts: 5
  maxSameFailure: 2

state:
  enabled: true
  path: .loop/state.yaml
  requiredFields:
    - run.id
    - run.status
    - run.iteration
    - run.fixAttempts
    - run.sameFailureCount
    - context.projectRoot
    - context.baselineCommit
    - context.baselineBranch
    - request.goal
    - request.acceptanceCriteria
    - active.phase
    - verification.status
    - review.status

git:
  captureBaselineAtInit: true
  recordBranch: true
  requireCleanBaseline: false
  captureDiffBeforeCompletion: true

evidence:
  enabled: true
  path: .loop/evidence/
  requireAcceptanceCriterionAssociation: true
  preserveFailures: true

states:
  - INIT
  - GOAL_REVIEW
  - WAITING_FOR_GOAL_CONFIRMATION
  - PLAN
  - IMPLEMENT
  - VERIFY
  - REVIEW
  - READY_FOR_CONFIRMATION
  - FIX
  - DONE
  - BLOCKED

confirmation:
  goal:
    required: true
    beforeImplementation: true
  result:
    required: true
    beforeDone: true

workflow:
  testFirst:
    enabled: true
    testFilesBeforeImplementation: true
    implementationModificationBlockedDuringTestPhase: true
    requireExecutableRedWithoutImplementation: false

completion:
  requireAllAcceptanceCriteria: true
  agentClaimIsEvidence: false
  requireVerificationPass: true
  requireReviewPass: true
  requireUserConfirmation: true
