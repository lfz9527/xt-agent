# Loop 配置文件版本。
version: 1

loop:
  # 单次 Loop 运行允许执行的最大迭代次数。
  maxIterations: 10
  # 单次 Loop 运行允许执行的最大 FIX 修复次数，超过后进入 BLOCKED。
  maxFixAttempts: 5
  # 同一失败连续出现的最大次数，超过后进入 BLOCKED。
  maxSameFailure: 2

state:
  # 是否启用 Loop 运行状态持久化。
  enabled: true
  # 项目级 Loop 状态文件路径。
  path: .loop/state.yaml
  # 持久化状态必须包含的字段。
  requiredFields:
    # 当前 Loop 运行的唯一 ID。
    - run.id
    # 当前状态机状态。
    - run.status
    # 当前已经执行的迭代次数。
    - run.iteration
    # 当前已经消耗的 FIX 次数。
    - run.fixAttempts
    # 当前连续重复失败的次数。
    - run.sameFailureCount
    # 当前项目根目录。
    - context.projectRoot
    # Loop 启动时记录的 Git 基线 Commit。
    - context.baselineCommit
    # Loop 启动时记录的 Git 基线分支。
    - context.baselineBranch
    # 用户本次要求 Loop 完成的目标。
    - request.goal
    # 用于判断任务是否完成的验收标准。
    - request.acceptanceCriteria
    # 当前正在执行的任务阶段。
    - active.phase
    # 当前验证结果状态。
    - verification.status
    # 当前 Review 结果状态。
    - review.status
    # 当前生效的用户信任等级。
    - permission.trust.level

# 用户信任等级决定 Loop 的默认授权策略。
# LOW 是安全默认值，用户可以主动提高信任等级。
trust:
  # 当前生效的信任等级，可选 low、medium、high、full。
  level: low
  levels:
    low:
      approval:
        # LOW 信任下，执行前必须经过用户确认。
        beforeExecution: required
        # LOW 信任下，完成前必须经过用户确认。
        beforeFinalize: required
    medium:
      approval:
        # MEDIUM 信任下，执行前自动通过确认 Gate。
        beforeExecution: automatic
        # MEDIUM 信任下，完成前仍需要用户确认最终结果。
        beforeFinalize: required
    high:
      approval:
        # HIGH 信任下，执行前自动通过确认 Gate。
        beforeExecution: automatic
        # HIGH 信任下，完成前自动通过确认 Gate。
        beforeFinalize: automatic
    full:
      approval:
        # FULL 信任下，执行前自动通过确认 Gate。
        beforeExecution: automatic
        # FULL 信任下，完成前自动通过确认 Gate。
        beforeFinalize: automatic

permissions:
  approval:
    # 执行前默认的确认策略，可由 Trust Level 覆盖。
    beforeExecution: required
    # 完成前默认的确认策略，可由 Trust Level 覆盖。
    beforeFinalize: required
  filesystem:
    # 是否允许 Loop 直接读取项目文件。
    read: allow
    # 是否允许 Loop 直接修改项目文件。
    write: allow
  shell:
    # 是否允许 Loop 执行普通 Shell 命令。
    execute: allow
    # 是否允许 Loop 执行高风险或破坏性 Shell 命令；confirm 表示需要用户确认。
    dangerous: confirm
  git:
    # 是否允许 Loop 直接读取 Git 状态、历史和 Diff。
    read: allow
    # 是否允许 Loop 创建 Git Commit；confirm 表示需要用户确认。
    commit: confirm
    # 是否允许 Loop 向远程仓库 Push；confirm 表示需要用户确认。
    push: confirm
  network:
    # 是否允许 Loop 发起外部网络请求；confirm 表示需要用户确认。
    request: confirm

# Trust Level 只能提供默认确认策略，不能绕过独立的高风险和安全策略。

git:
  # 是否在 Loop 初始化时记录 Git 基线 Commit。
  captureBaselineAtInit: true
  # 是否记录 Loop 启动时所在的 Git 分支。
  recordBranch: true
  # 工作区存在未提交修改时，是否阻止 Loop 初始化。
  requireCleanBaseline: false
  # 是否在 Loop 完成前记录相对于基线的 Git Diff。
  captureDiffBeforeCompletion: true

evidence:
  # 是否启用验证和 Review 证据记录。
  enabled: true
  # Loop 运行证据的保存目录。
  path: .loop/evidence/
  # 是否要求每一个验收标准都关联对应的证据。
  requireAcceptanceCriterionAssociation: true
  # 是否保留验证失败产生的证据，供后续 FIX 使用。
  preserveFailures: true

# Loop 状态机支持的完整状态列表。
states:
  # Loop 初始化并加载项目上下文。
  - INIT
  # 定义和 Review Goal、Acceptance Criteria 以及验证策略。
  - GOAL_REVIEW
  # 执行前的用户授权确认 Gate。
  - WAITING_FOR_GOAL_CONFIRMATION
  # 将已确认的 Goal 转换为可执行任务。
  - PLAN
  # 执行当前实现任务。
  - IMPLEMENT
  # 根据 Acceptance Criteria 验证实现结果。
  - VERIFY
  # Review 实现质量、证据、项目规则以及 Git Diff。
  - REVIEW
  # 完成前的最终结果确认 Gate。
  - READY_FOR_CONFIRMATION
  # 验证、Review 或用户拒绝结果后执行修复。
  - FIX
  # Loop 成功完成后的终止状态。
  - DONE
  # 无法安全继续执行时进入的终止状态。
  - BLOCKED

confirmation:
  goal:
    # 是否启用 Goal 确认 Gate。
    required: true
    # 是否要求在进入 IMPLEMENT 前完成 Goal 确认。
    beforeImplementation: true
  result:
    # 是否启用最终结果确认 Gate。
    required: true
    # 是否要求在进入 DONE 前完成最终结果确认。
    beforeDone: true

workflow:
  testFirst:
    # 是否启用项目的 Test First 策略。
    enabled: true
    # Test First 策略要求时，是否必须先创建或修改测试文件。
    testFilesBeforeImplementation: true
    # Test First 阶段是否禁止修改实现文件。
    implementationModificationBlockedDuringTestPhase: true
    # 是否要求实现前必须存在一个可执行且失败的测试。
    requireExecutableRedWithoutImplementation: false

completion:
  # 是否要求所有 Acceptance Criteria 都满足后才能完成。
  requireAllAcceptanceCriteria: true
  # Agent 自己声称完成是否可以作为验证证据。
  agentClaimIsEvidence: false
  # 是否要求所有适用的验证通过后才能完成。
  requireVerificationPass: true
  # 是否要求 Review 通过后才能完成。
  requireReviewPass: true
  # 是否将用户确认作为完成条件；具体是否需要人工确认由 Permission/Trust Policy 决定。
  requireUserConfirmation: true
