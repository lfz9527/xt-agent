# Loop 引擎定义配置。
# 本文件只描述引擎能力、默认限制和固定安全规则，不保存具体项目配置。
# 项目的实际配置与运行产物统一落在项目根目录 `.loop/` 工作区。
version: 1

engine:
  # 单次 Loop 允许的最大迭代次数。
  maxIterations: 10
  # 单次 Loop 允许的最大修复次数。
  maxFixAttempts: 5
  # 同一失败连续出现的最大次数。
  maxSameFailure: 2

trust:
  # Trust 是项目级属性，这里只定义等级的通用审批语义。
  levels:
    low:
      # LOW 默认要求执行前人工审批。
      beforeExecution: required
      # LOW 默认要求完成前人工审批。
      beforeFinalize: required
    medium:
      # MEDIUM 默认允许执行前自动通过。
      beforeExecution: automatic
      # MEDIUM 默认要求完成前人工审批。
      beforeFinalize: required
    high:
      # HIGH 默认允许执行前自动通过。
      beforeExecution: automatic
      # HIGH 默认允许完成前自动通过。
      beforeFinalize: automatic
    full:
      # FULL 默认允许执行前自动通过。
      beforeExecution: automatic
      # FULL 默认允许完成前自动通过。
      beforeFinalize: automatic

security:
  # 高风险能力必须经过独立安全策略判断，不能仅靠 Trust 放行。
  highRiskRequiresIndependentPolicy: true
  # 任意显式 deny 都优先于其他允许规则。
  denyAlwaysWins: true

workflow:
  # Loop 的固定生命周期状态集合。
  states:
    - INIT
    - GOAL_REVIEW
    - WAITING_FOR_GOAL_CONFIRMATION
    - PLAN
    - IMPLEMENT
    - VERIFY
    - REVIEW
    - READY_FOR_CONFIRMATION
    - FIX
    - DONE
    - BLOCKED
  testFirst:
    # 是否启用 Test First 规则。
    enabled: true
    # Test First 时是否要求测试文件先于实现文件处理。
    testFilesBeforeImplementation: true
    # Test First 阶段是否禁止修改实现文件。
    implementationModificationBlockedDuringTestPhase: true
    # 是否强制要求实现前出现可执行的失败测试。
    requireExecutableRedWithoutImplementation: false

completion:
  # 是否启用最终完成审批 Gate。
  finalApprovalGateEnabled: true
  # 是否要求所有验收标准满足。
  requireAllAcceptanceCriteria: true
  # Agent 自己声称完成不能作为 Evidence。
  agentClaimIsEvidence: false
  # 是否要求 Verification 通过。
  requireVerificationPass: true
  # 是否要求 Review 通过。
  requireReviewPass: true

persistence:
  # Loop 产物统一由项目 `.loop/` 工作区承载；具体目录由 Runtime Artifact Contract 定义。
  workspace: .loop
