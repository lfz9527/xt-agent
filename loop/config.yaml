version: 1

loop:
  maxIterations: 10
  maxFixAttempts: 5
  maxSameFailure: 2

state:
  enabled: true
  path: .loop/state.yaml
  requiredFields:
    - run.id
    - run.status
    - run.iteration
    - run.fixAttempts
    - run.sameFailureCount
    - context.projectRoot
    - context.baselineCommit
    - context.baselineBranch
    - request.goal
    - request.acceptanceCriteria
    - active.phase
    - verification.status
    - review.status
    - permission.trust.level

# Trust is the user's default authorization policy for Loop.
# LOW is the secure default. Users may explicitly raise the level.
trust:
  level: low
  levels:
    low:
      approval:
        beforeExecution: required
        beforeFinalize: required
    medium:
      approval:
        beforeExecution: automatic
        beforeFinalize: required
    high:
      approval:
        beforeExecution: automatic
        beforeFinalize: automatic
    full:
      approval:
        beforeExecution: automatic
        beforeFinalize: automatic

permissions:
  approval:
    beforeExecution: required
    beforeFinalize: required
  filesystem:
    read: allow
    write: allow
  shell:
    execute: allow
    dangerous: confirm
  git:
    read: allow
    commit: confirm
    push: confirm
  network:
    request: confirm

# Trust levels may provide default approval behavior, but must not bypass
# independent high-risk or safety policies.

git:
  captureBaselineAtInit: true
  recordBranch: true
  requireCleanBaseline: false
  captureDiffBeforeCompletion: true

evidence:
  enabled: true
  path: .loop/evidence/
  requireAcceptanceCriterionAssociation: true
  preserveFailures: true

states:
  - INIT
  - GOAL_REVIEW
  - WAITING_FOR_GOAL_CONFIRMATION
  - PLAN
  - IMPLEMENT
  - VERIFY
  - REVIEW
  - READY_FOR_CONFIRMATION
  - FIX
  - DONE
  - BLOCKED

confirmation:
  goal:
    required: true
    beforeImplementation: true
  result:
    required: true
    beforeDone: true

workflow:
  testFirst:
    enabled: true
    testFilesBeforeImplementation: true
    implementationModificationBlockedDuringTestPhase: true
    requireExecutableRedWithoutImplementation: false

completion:
  requireAllAcceptanceCriteria: true
  agentClaimIsEvidence: false
  requireVerificationPass: true
  requireReviewPass: true
  requireUserConfirmation: true
