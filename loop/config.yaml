# Loop 引擎定义配置。
# 本文件只描述引擎能力、默认限制和固定安全规则，不保存具体项目配置。
# 项目的实际配置与运行产物统一落在项目根目录 `.loop/` 工作区。
version: 1

engine:
  # 单次 Loop 允许的最大迭代次数。
  maxIterations: 10
  # 单次 Loop 允许的最大修复次数。
  maxFixAttempts: 5
  # 同一失败连续出现的最大次数。
  maxSameFailure: 2

trust:
  # Trust 是项目级属性，这里只定义等级的通用审批语义。
  levels:
    low:
      beforeExecution: required
      beforeFinalize: required
    medium:
      beforeExecution: automatic
      beforeFinalize: required
    high:
      beforeExecution: automatic
      beforeFinalize: automatic
    full:
      beforeExecution: automatic
      beforeFinalize: automatic

security:
  # 高风险能力必须经过独立安全策略判断，不能仅靠 Trust 放行。
  highRiskRequiresIndependentPolicy: true
  # 任意显式 deny 都优先于其他允许规则。
  denyAlwaysWins: true

policy:
  # P0 决策模型、Policy Snapshot 和 State Transition Guard 的正式契约。
  decisionSchema: schemas/policy.yaml
  snapshotSchema: schemas/policy-snapshot.yaml
  # 每次运行解析策略时必须产生单调 Revision。
  revisionRequired: true
  # 执行前必须校验 Snapshot Revision 与当前项目策略 Revision 一致。
  requireRevisionMatchBeforeExecution: true
  # Runtime 必须拒绝无效 Revision，且策略变更只能产生更高 Revision。
  requirePositiveIntegerRevision: true
  requireMonotonicRevision: true
  # Policy Snapshot 在 Run 创建后视为只读；变更策略必须生成新的 Snapshot。
  snapshotImmutable: true

workflow:
  # Loop 的固定生命周期状态集合。
  states:
    - INIT
    - GOAL_REVIEW
    - WAITING_FOR_GOAL_CONFIRMATION
    - PLAN
    - IMPLEMENT
    - VERIFY
    - REVIEW
    - READY_FOR_CONFIRMATION
    - FIX
    - DONE
    - BLOCKED
    - PAUSED
  testFirst:
    enabled: true
    testFilesBeforeImplementation: true
    implementationModificationBlockedDuringTestPhase: true
    requireExecutableRedWithoutImplementation: false

completion:
  finalApprovalGateEnabled: true
  requireAllAcceptanceCriteria: true
  agentClaimIsEvidence: false
  requireVerificationPass: true
  requireReviewPass: true

persistence:
  # Loop 产物统一由项目 `.loop/` 工作区承载；具体目录由 Runtime Artifact Contract 定义。
  workspace: .loop
