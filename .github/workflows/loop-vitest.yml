name: Loop Runtime Tests

on:
  push:
    branches:
      - loop/permission-system
  pull_request:
    paths:
      - 'loop/**'
      - '.github/workflows/loop-vitest.yml'

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run Vitest
        run: npm test
